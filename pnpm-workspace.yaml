packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts by default; the prepare builds
# need this allowlist or the packages install without dist/ (CONSUMING.md).
onlyBuiltDependencies:
  - "@platform/contracts"
  - "@platform/kernel-types"
  - "@platform/i18n"
  - "@platform/ui-tokens"
  - "@platform/certification"
  # workerd: the real Workers runtime used by the commerce-core reservation-DO
  # adversarial tests (WO-1.1); its postinstall places the binary.
  - "workerd"

# ═══ THE OVERRIDES ARE THE REAL PIN ═══
#
# @platform/contracts depends on @platform/kernel-types at a version that
# exists on no registry, and @platform/certification (WO-2.5) depends on
# @platform/contracts + @platform/ui-tokens the same way; the overrides route
# EVERY transitive resolution to the same pinned git ref (CONSUMING.md).
# Founder ruling: tags are unreliable, the release ref is the commit.
#
# Editing the per-package dependency strings alone changes NOTHING: pnpm
# routes every resolution through here, so a repin that misses this block
# silently keeps the OLD canon while every package.json claims the new one.
# That is not hypothetical — boutik-plus hit it in CATEGORY-WIRE-1: manifests
# repinned, `pnpm install` green, typecheck 13/13, and the stale override held
# contracts a MAJOR behind (wire TYPE from certification, RUNTIME schema from
# contracts; 21 tests red). After touching any pin, verify the INSTALLED
# package — `node -p "require('@platform/contracts/package.json').version"` —
# never the manifest.
#
# LIVRES-1 (AUDIT-SHOP-2 F-37) — THIS BLOCK STATES ONLY WHAT IS INSTALLED
# TODAY. It used to narrate every earlier pin, and its numbers drifted from
# its own lines for two months (« 3.13.0 (35a21ea) » beside b384da9;
# « v0.9.9 (1c98ad1) » beside be2199c and an installed 1.1.0): a warning that
# models the hazard it warns about. The history of each move — 0ff6696
# (v0.5.0) → 58e249b (v3.3.0, the return leg) → 767e6d0 (v3.0.0,
# CATEGORY-WIRE-1) → a418ca4 (v3.12.0, POLITIQUE-AU-QUOTE) → 35a21ea (v3.13.0,
# FRAIS-ZERO) → b384da9; ui-tokens 1c98ad1 (v0.9.9, WO-7.0 unification) →
# be2199c — lives in JOURNAL.md under the slice that made it.
#
# INSTALLED (verified 2026-09-09):
#   @platform/contracts    b384da9 → 3.13.1  FRAIS-ZERO (founder order
#                          2026-08-25): both RoundingLaw numerators 0/100; the
#                          law, the fee fields and every reconciliation
#                          identity stand. 3.13.1 = 3.13.0 + canon's own
#                          lockfile catch-up, content identical.
#   @platform/kernel-types b384da9 → 3.13.1  moves WITH contracts, always.
#   @platform/ui-tokens    be2199c → 1.1.0   ONE default instance for
#                          buyer-pwa + reseller-app + the certification
#                          transitive (Grand Teint API); the four manifests
#                          that name it now name this same sha.
#   @platform/i18n         NOT overridden — pinned directly in every manifest
#                          to a418ca4 → 3.12.0 (the copy-lint with the F12
#                          administrative-register stems).
overrides:
  "@platform/kernel-types": "git+https://github.com/beurni2/platform-contracts.git#b384da99a0803471a052b2fa271dc768426454dd&path:packages/kernel-types"
  "@platform/contracts": "git+https://github.com/beurni2/platform-contracts.git#b384da99a0803471a052b2fa271dc768426454dd&path:packages/contracts"
  "@platform/ui-tokens": "git+https://github.com/beurni2/platform-contracts.git#be2199c95d27e6ae5f6c7381c12e18a9796d9800&path:packages/ui-tokens"
