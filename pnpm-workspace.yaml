packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts by default; the prepare builds
# need this allowlist or the packages install without dist/ (CONSUMING.md).
onlyBuiltDependencies:
  - "@platform/contracts"
  - "@platform/kernel-types"
  - "@platform/i18n"
  - "@platform/ui-tokens"
  - "@platform/certification"
  # workerd: the real Workers runtime used by the commerce-core reservation-DO
  # adversarial tests (WO-1.1); its postinstall places the binary.
  - "workerd"

# @platform/contracts depends on @platform/kernel-types@0.4.0, and
# @platform/certification (WO-2.5: §3 re-certification of the grown payment
# mock) depends on @platform/contracts@0.5.0 + @platform/ui-tokens@0.5.0 —
# none exist on any registry; the overrides route every transitive
# resolution to the same pinned git ref (CONSUMING.md). Pin = sha 0ff6696a
# (canon v0.5.0; founder ruling: tags are unreliable, the release ref is
# the commit).
#
# READINESS-RETURN-1c (founder order 2026-08-02): re-pinned to canon v3.3.0
# (sha 58e249b) — the RETURN LEG, `fulfillment.accepted.v1` +
# `fulfillment.ready.v1`, which this repo now RECEIVES so a reseller's
# follow-up can continue past « payée ». ADDITIVE (no export removed, no
# existing schema changed), hence MINOR. contracts + kernel-types move
# together as always.
overrides:
  # @platform/contracts re-pinned to canon v3.0.0 (sha 767e6d0) — CATEGORY-WIRE-1,
  # founder-authorized 2026-08-01: `SupplyProjection` gains `category`, REQUIRED,
  # so this service can pick the §6.2 at-door inspection row and stop reading a
  # category off the buyer's own checkout request (§6.1). MAJOR, because the
  # producer's wire shape changes — the same class as v2.0.0's
  # productName/assetRefs. @platform/kernel-types moves WITH it this time
  # (contracts@3.0.0 declares kernel-types@3.0.0); its content is unchanged, so
  # the move only stops the override from asserting a version that is not there.
  #
  # THIS OVERRIDE IS THE REAL PIN. Editing the per-package dependency strings
  # alone changes nothing: pnpm routes every resolution through here, so a
  # repin that misses this line silently keeps the OLD canon while every
  # package.json claims the new one.
  #
  # THAT IS NOT HYPOTHETICAL — boutik-plus hit it in this very slice. Its
  # package.jsons were repinned, `pnpm install` succeeded, and `typecheck`
  # passed 13/13, while the stale override held @platform/contracts a MAJOR
  # behind: the wire TYPE came from @platform/certification (which had moved)
  # and the RUNTIME schema from @platform/contracts (which had not). Types said
  # eight fields, the validator refused the eighth, 21 tests failed. After
  # touching any pin, verify the INSTALLED package, not the manifest.
  "@platform/kernel-types": "git+https://github.com/beurni2/platform-contracts.git#18e5cfec25d528abb8ac490d9dc0e16213f40502&path:packages/kernel-types"
  "@platform/contracts": "git+https://github.com/beurni2/platform-contracts.git#18e5cfec25d528abb8ac490d9dc0e16213f40502&path:packages/contracts"
  # @platform/ui-tokens is UNIFIED at canon v0.9.9 (1c98ad1, + Storefront aggregate fields WO-5.13) — WO-7.0/WO-7.2b/SP#001-A
  # killed the WO-5.3 per-app skew and re-pinned the whole workspace to the current
  # release in one bump. reseller-app runs its visual layer on the Grand Teint API
  # (theme.colours, top-level type/spacing/radius/touch/interaction, the nav glyphs
  # + dimension.iconSizePx.tab). ONE default instance for buyer-pwa + reseller-app
  # + the @platform/certification transitive — no scoped exception. The former
  # `@platform/certification>@platform/ui-tokens` v0.6.0 override is DELETED: the
  # neutralColors→sharedColour rename landed at v0.8.0, so the report-html bug
  # existed only in the ancient v0.6.0 snapshot; certification at v0.9.9 resolves
  # sharedColour and needs no override (CTO ruling, WO-7.0 re-pin).
  "@platform/ui-tokens": "git+https://github.com/beurni2/platform-contracts.git#be2199c95d27e6ae5f6c7381c12e18a9796d9800&path:packages/ui-tokens"
