# STOREFRONT-DEPLOY-1 — the COMBINED Worker deploy config (founder ruling:
# one combined Worker = index.ts's service routes + both Durable Object classes
# + the R2 binding).
#
# UNPROVEN UNTIL A REAL `wrangler deploy` RUNS. Miniflare binds the DOs and R2 by
# its OWN test config, never this file — so the bindings and especially the
# [[migrations]] block below are validated only by an actual deploy, not by any
# green CI. A malformed migration passes every test and fails only on deploy.

name = "storefront-service"
# The pre-built combined bundle (esbuild, the same artifact the miniflare e2e
# runs); the deploy workflow runs `bundle:worker:combined` before `wrangler deploy`.
main = "dist/worker/worker.mjs"
compatibility_date = "2025-07-05"

# One Durable Object binding per aggregate, addressed by idFromName(id) inside.
[[durable_objects.bindings]]
name = "STOREFRONT"
class_name = "StorefrontDO"

[[durable_objects.bindings]]
name = "LISTING"
class_name = "ListingDO"

# SP3.2a — the checkout authority. One instance per QUOTE ID, plus one per
# request key (the Shape C idempotency pointer, same class, different name).
[[durable_objects.bindings]]
name = "CHECKOUT"
class_name = "CheckoutDO"

# SP3.3a — the order authority. One instance per ORDER ID, and the order id is a
# function of the quote id (`orderIdForQuote`), so one quote can never grow a
# second order and the reservation receipt can live in the same object that will
# be asked about it.
[[durable_objects.bindings]]
name = "ORDER"
class_name = "OrderDO"

# BC-1a — the dispatch index. ONE singleton instance (idFromName inside):
# order ids + first-seen clocks only, so the founder's dispatch read can find
# the per-order objects. No contact, no money — those never leave OrderDO
# except through the CHECKOUT_OPS_SECRET-gated read.
[[durable_objects.bindings]]
name = "DISPATCH"
class_name = "DispatchIndexDO"

# RF-1a — the reseller feed. ONE singleton: her personal-code door and her
# index of CONFIRMED sales (ids + clocks; every franc is read from the order
# at read time, never stored here).
[[durable_objects.bindings]]
name = "RESELLER"
class_name = "ResellerFeedDO"

# SP6.3 — the §6.4 buyer-refusal ladder. ONE INSTANCE PER BUYER, named by her
# normalised phone (`cleAcheteur`), which is what makes the object itself the
# per-buyer lock: two refusals reported for the same woman serialise, and a
# refusal for a different woman cannot reach her record. Holds the canonical
# PayAtDoorEligibility and nothing else — no money, no order, no contact.
[[durable_objects.bindings]]
name = "LADDER"
class_name = "BuyerLadderDO"

[[durable_objects.bindings]]
name = "COMPTES"
class_name = "ResellerAccountsDO"

# FIRST-DEPLOY MIGRATION — create both DO classes. `new_sqlite_classes` is CORRECT
# AND MANDATORY, not a coin-flip: Cloudflare stopped issuing key-value-backed DO
# namespaces (changelog 2026-07-09) to any account without a pre-existing one, and
# the Workers Free plan only ever supported the SQLite backend — so this NEW account
# would have `new_classes` rejected outright. SQLite-backed DOs expose the SAME
# key-value storage API this DO code uses (state.storage.get/put), so no code change
# follows. The one remaining first-deploy unknown is R2 write permission on the token.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["StorefrontDO", "ListingDO"]

# SP3.2a — CheckoutDO arrives as its OWN tag. A migration list is append-only
# and each tag is applied once: editing the v1 line instead would have been a
# no-op on an account that already ran it, so the class would never be created
# and every checkout route would fail on a missing binding. Same UNPROVEN-UNTIL-
# DEPLOY caveat as the header: Miniflare binds this class by its own test config,
# never by this file.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["CheckoutDO"]

# SP3.3a — OrderDO arrives as its OWN tag, for the identical reason v2 did: the
# migration list is append-only and each tag is applied once, so editing v2
# instead would be a no-op on an account that already ran it and the class would
# never be created. Same UNPROVEN-UNTIL-DEPLOY caveat as the header.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["OrderDO"]

# BC-1a — DispatchIndexDO arrives as its OWN tag, for the identical
# append-only reason every tag above states. Same UNPROVEN-UNTIL-DEPLOY caveat.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["DispatchIndexDO"]

# RF-1a — ResellerFeedDO on its OWN tag, the append-only law every tag above
# states. Same UNPROVEN-UNTIL-DEPLOY caveat.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["ResellerFeedDO"]

# SP6.3 — BuyerLadderDO on its OWN tag, for the identical reason v2–v5 each
# took one: the migration list is append-only and every tag is applied once, so
# editing v5 instead would be a no-op on an account that already ran it and the
# class would never be created. Same UNPROVEN-UNTIL-DEPLOY caveat as the header:
# Miniflare binds this class from its own test config, never from this file.
[[migrations]]
tag = "v6"
new_sqlite_classes = ["BuyerLadderDO"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["ResellerAccountsDO"]

# The PRIVATE R2 bucket (exists: Standard, jurisdiction default, location hint
# ENAM). Reads go THROUGH the Worker (GET /media/{key}); never a public custom
# domain — that would let anyone enumerate media keys.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "beurni-storefront-media"

# The service's own origin, so R2 read URLs are absolute. Empty ⇒ relative
# `/media/{key}` (same origin) — which is what shipped, and it was WRONG the moment
# PERSONNALISER-MEDIA-1 started writing this URL onto her storefront: React Native's
# <Image> cannot resolve a relative URI (her own app drew nothing), and a browser
# resolved it against the PWA's origin (`https://beurni2.github.io/media/…` → 404).
# The e2e missed it because it compared two equally-relative strings.
#
# NOW SET, per the instruction this line has carried since the first deploy.
[vars]
MEDIA_PUBLIC_BASE = "https://storefront-service.ilboudobernard2.workers.dev"

# PRODUCT-MEDIA-BASE-1 — the PUBLIC origin serving boutik's PRODUCT photographs.
#
# NOT THE SAME THING AS MEDIA_PUBLIC_BASE ABOVE, and the distinct name is the point.
# MEDIA_PUBLIC_BASE is THIS service's own origin for `beurni-storefront-media` — HER
# cover and avatar. Product photographs live in a DIFFERENT bucket,
# `beurni-boutik-product-media`, served by boutik's media-service at GET /media/{key}.
# Two buckets, two bases: pointing one at the other 404s every single ref.
#
# A canon `assetRef` is a RELATIVE path (`media/{kind}/{captureRef}`). This value is
# what makes it absolute before it reaches a buyer. EMPTY IS SAFE AND IS THE DEFAULT:
# an unset base yields NO refs at all, so the buyer surface draws its designed
# « SANS PHOTO » state instead of a bare relative ref that would resolve against the
# PWA's own origin and render as a broken image.
#
# DELIBERATELY A [vars] VALUE, NOT A SECRET — it is a public origin with nothing to
# protect, and the SUPPLY_BASE lesson was that a write-only value nobody can read
# back costs founder round-trips when it is wrong. This one is readable and
# versioned right here. Set it to boutik's deployed media-service origin.
# SET 2026-07-25 (founder order). THE HOST IS PROVEN, NOT DERIVED: the founder
# fetched one of his own product photographs from it successfully. That distinction
# is the whole SUPPLY_BASE lesson — a base nobody has read back is a base nobody
# knows is right.
PRODUCT_MEDIA_BASE = "https://media-service.ilboudobernard2.workers.dev"

# SERVICE-WRITE-AUTH-1 — the shared write secret (STOREFRONT_WRITE_SECRET) is NOT
# here and must NEVER be added to [vars]: all five repos are PUBLIC and anything in
# [vars] is committed and published. It is set out-of-band with
# `wrangler secret put STOREFRONT_WRITE_SECRET` (encrypted, not in the repo). The
# gate fails CLOSED: until the secret is set, every write returns 401 by design —
# so set the secret BEFORE (or right after) deploying the gate, or writes look broken.

# SP3.3a — PAYMENT_WEBHOOK_SECRET is likewise ABSENT from this file and must never
# be added to [vars]. It gates `POST /checkout/webhook/payment`, the only route on
# this Worker that can declare money received, and it is a SEPARATE secret from the
# write key on purpose: the write key ships inside the reseller app bundle, so
# reusing it would mean every phone that has the app can assert that an order is
# paid. `wrangler secret put PAYMENT_WEBHOOK_SECRET`. UNSET ⇒ every webhook is 401
# by design — which means an order can be created and charged but can never be
# confirmed until the secret is set. That is the correct failure direction.
#
# PAYMENT_SANDBOX_BEHAVIOR is also absent, and absent is its DEPLOYED value: it
# configures the certified sandbox mock's misbehaviour for tests. It carries no
# payment truth (webhooks are the only payment truth) and names no provider.

# ORDER-PAID-WIRE-1b — FULFILLMENT_WRITE_SECRET is this Worker's copy of the
# shared credential the boutik fulfillment intake gates on, presented as
# `Authorization: Bearer` when the OrderDO's alarm delivers `order.confirmed.v1`
# through the OFFER binding. Set with `wrangler secret put
# FULFILLMENT_WRITE_SECRET` HERE, and the SAME value on offer-service (its
# gate). Never [vars]: the repos are public. UNSET ⇒ deliveries are attempted
# without the header, boutik answers 401, and the outbox retries hourly — the
# money path never notices, and the backlog drains the moment both sides hold
# the value.

# BROWSE-SUPPLY-BINDING-1 — the supply hop is a SERVICE BINDING, the platform's own
# mechanism for Worker-to-Worker in one account: no network hop, no public URL, and
# no same-zone fetch restriction (error 1042 — a Worker cannot `fetch` another
# Worker on the same workers.dev zone, which is one candidate for why the public-URL
# hop failed closed for a full day and had NEVER succeeded).
#
# THE CONFIGURATION IS NOW READABLE: this block is versioned and reviewable, where
# SUPPLY_BASE was a write-only secret that burned three founder round-trips because
# nobody — including him — could inspect what it held. SUPPLY_BASE no longer exists.
# SUPPLY_READ_SECRET stays (wrangler secret, never [vars]): boutik's Bearer gate is
# load-bearing and the Authorization header flows fine through a binding.
[[services]]
binding = "OFFER"
service = "offer-service"

# ═══════════════════════════════════════════════════════════════════════════
# READINESS-RETURN-1c — THE RETURN LEG'S INTAKE SECRET.
# ═══════════════════════════════════════════════════════════════════════════
# `PROGRESS_WRITE_SECRET` gates POST /fulfillment/progress ONLY — the route
# Boutik+ delivers `fulfillment.accepted.v1` / `fulfillment.ready.v1` to, so a
# reseller's follow-up can continue past « payée ».
#
# ITS OWN VALUE, deliberately. FULFILLMENT_WRITE_SECRET is THIS Worker's key to
# write INTO Boutik+; this one is Boutik+'s key to write into this Worker. One
# key must never unlock the other direction's capability — the same separation
# every other secret here keeps.
#
# Set the SAME value on BOTH Workers with `wrangler secret put
# PROGRESS_WRITE_SECRET` (piped, never passed as an argument). UNSET ⇒ the
# intake answers 401 to everyone — including a caller who sends no header at
# all, which is asserted by its own test — and Boutik+'s outbox retries on its
# backoff until both sides hold it. Nothing is lost while it is unset.
