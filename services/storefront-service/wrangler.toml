# STOREFRONT-DEPLOY-1 — the COMBINED Worker deploy config (founder ruling:
# one combined Worker = index.ts's service routes + both Durable Object classes
# + the R2 binding).
#
# UNPROVEN UNTIL A REAL `wrangler deploy` RUNS. Miniflare binds the DOs and R2 by
# its OWN test config, never this file — so the bindings and especially the
# [[migrations]] block below are validated only by an actual deploy, not by any
# green CI. A malformed migration passes every test and fails only on deploy.

name = "storefront-service"
# The pre-built combined bundle (esbuild, the same artifact the miniflare e2e
# runs); the deploy workflow runs `bundle:worker:combined` before `wrangler deploy`.
main = "dist/worker/worker.mjs"
compatibility_date = "2025-07-05"

# One Durable Object binding per aggregate, addressed by idFromName(id) inside.
[[durable_objects.bindings]]
name = "STOREFRONT"
class_name = "StorefrontDO"

[[durable_objects.bindings]]
name = "LISTING"
class_name = "ListingDO"

# FIRST-DEPLOY MIGRATION — create both DO classes. `new_sqlite_classes` is CORRECT
# AND MANDATORY, not a coin-flip: Cloudflare stopped issuing key-value-backed DO
# namespaces (changelog 2026-07-09) to any account without a pre-existing one, and
# the Workers Free plan only ever supported the SQLite backend — so this NEW account
# would have `new_classes` rejected outright. SQLite-backed DOs expose the SAME
# key-value storage API this DO code uses (state.storage.get/put), so no code change
# follows. The one remaining first-deploy unknown is R2 write permission on the token.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["StorefrontDO", "ListingDO"]

# The PRIVATE R2 bucket (exists: Standard, jurisdiction default, location hint
# ENAM). Reads go THROUGH the Worker (GET /media/{key}); never a public custom
# domain — that would let anyone enumerate media keys.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "beurni-storefront-media"

# The service's own origin, so R2 read URLs are absolute. Empty ⇒ relative
# `/media/{key}` (same origin). Set to the deployed URL after the first deploy.
[vars]
MEDIA_PUBLIC_BASE = ""

# SERVICE-WRITE-AUTH-1 — the shared write secret (STOREFRONT_WRITE_SECRET) is NOT
# here and must NEVER be added to [vars]: all five repos are PUBLIC and anything in
# [vars] is committed and published. It is set out-of-band with
# `wrangler secret put STOREFRONT_WRITE_SECRET` (encrypted, not in the repo). The
# gate fails CLOSED: until the secret is set, every write returns 401 by design —
# so set the secret BEFORE (or right after) deploying the gate, or writes look broken.

# BROWSE-SUPPLY-BINDING-1 — the supply hop is a SERVICE BINDING, the platform's own
# mechanism for Worker-to-Worker in one account: no network hop, no public URL, and
# no same-zone fetch restriction (error 1042 — a Worker cannot `fetch` another
# Worker on the same workers.dev zone, which is one candidate for why the public-URL
# hop failed closed for a full day and had NEVER succeeded).
#
# THE CONFIGURATION IS NOW READABLE: this block is versioned and reviewable, where
# SUPPLY_BASE was a write-only secret that burned three founder round-trips because
# nobody — including him — could inspect what it held. SUPPLY_BASE no longer exists.
# SUPPLY_READ_SECRET stays (wrangler secret, never [vars]): boutik's Bearer gate is
# load-bearing and the Authorization header flows fine through a binding.
[[services]]
binding = "OFFER"
service = "offer-service"
