name: pwa-preview

# WO-4.2E — the buyer PWA preview channel: the founder cannot open a
# website that is deployed nowhere. On every main push: build the PWA
# (vite base './' — relative, project-pages-safe), prove the payload
# budget on THAT build, and deploy to GitHub Pages via stock actions.
# FOUNDER ONE-CLICK (only if the first run errors on Pages-not-enabled):
# shop-plus → Settings → Pages → Source: "GitHub Actions".
# The deployed preview is a SANDBOX: the payment provider is the certified
# mock and nothing is ever debited. The on-screen ribbon that used to say so
# was removed on the founder's order (2026-08-14, BANDEAUX-RETIRÉS), so the
# sandbox status is no longer stated to the visitor — see JOURNAL.md. The
# root lands on the walkable journey. No production claim, ever.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ═══ INCIDENT 2026-08-13 — A PUBLISH IS NEVER KILLED MID-FLIGHT ═══
#
# The founder's live storefront lost its en-têtes, cover and articles after the
# 2026-08-12 deploy batch — and a forensic replay EXONERATED the code: a shop
# written by the actually-deployed 49440ff worker (canon 3.7.0) read perfectly
# under the batch build (canon 3.12.0), byte for byte, publish included; the
# built-bundle diff carried only relaxations and the storefront read path has
# no schema parse at all. What the incident window DID have is two runs of this
# workflow racing, one CANCELLED by `cancel-in-progress: true` — a Pages
# publish killed partway. Any redeploy healed the page, which is the signature
# of a bad artifact, not bad content.
#
# So publishes now QUEUE instead of killing each other. A superseded run
# wastes a few runner minutes; a half-cancelled publish costs the founder his
# storefront and a four-repo revert.
concurrency:
  group: pwa-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # CHAINE-DEPLOI-1 (AUDIT-SHOP-2 F-09) — actions pinned to commit SHAs
      # (tag kept beside each for reading); see ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # CHAINE-DEPLOI-1 (F-36) — the scoped platform-contracts grant, exactly
      # as ci.yml explains it: a temp gitconfig only this step reads, deleted
      # after the install; nothing written when the secret is unset.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          pnpm install --frozen-lockfile
          rm -f "$GIT_CONFIG_GLOBAL"
      # BUYER-LIVE-WIRE-1 (founder order, step 4 of five) — the buyer PWA stops
      # running on the demo storefront port and reads the LIVE service.
      #
      # WHY IT IS HERE AND NOT IN vite.config.ts: this gate script IS the deploy
      # build (`execSync('pnpm --filter … build')` inside pwa-payload-budget.mjs),
      # so the value must be in this step's env or it never reaches vite. Setting it
      # here also keeps CI honest: `pnpm gates` runs the same script with the
      # variable UNSET, so the CI build keeps resolving the in-process demo port and
      # no test run can accidentally depend on a live Worker.
      #
      # READABLE AND VERSIONED, NEVER A SECRET — the same discipline as
      # PRODUCT_MEDIA_BASE. It is a public origin with nothing to protect, and the
      # SUPPLY_BASE lesson was that a value nobody can read back costs round-trips
      # when it is wrong. It is written here where a reviewer can see it.
      #
      # UNLIKE a Worker [vars] binding, this one IS a build-time substitution: vite
      # inlines `import.meta.env.VITE_*` into the emitted JS, so the deployed bundle
      # genuinely carries the literal and IS greppable — the same mechanism as the
      # esbuild --define stamps, and the reason the artifact check works here.
      #
      # CORS PRECONDITION, verified: the service allows exactly
      # `https://beurni2.github.io` (storefront-service/src/index.ts CORS_READ_ORIGIN),
      # which is this deploy's origin. A LOCAL PWA build pointed at the live Worker
      # still fails CORS by design — a known, accepted limitation, not a bug.
      - name: Payload budget gate on THE deploy build (< 300 KB compressed, PERF-BUDGETS)
        env:
          VITE_STOREFRONT_BASE: https://storefront-service.ilboudobernard2.workers.dev
        run: node scripts/gates/pwa-payload-budget.mjs
      # BUG 2 — the deploy ships dist AS-IS. The old redirect-wrapper (a fresh
      # index.html that meta-refreshed to app.html) CLOBBERED the SPA restore:
      # the 404.html sends every /v/ and /s/ deep link to `/shop-plus/?/…`,
      # which serves index.html — but the wrapper discarded that restore query
      # and forced its own landing, so no deep link ever restored. Deploying the
      # real index.html (the app, with the restore script) is what makes the
      # storefront links boot. The deployed root is the app's real root (S3
      # DÉCOUVERTE); a demo landing, if wanted, belongs in the app's routing,
      # never a wrapper that eats the restore.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/buyer-pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
