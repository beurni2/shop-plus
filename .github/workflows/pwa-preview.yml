name: pwa-preview

# WO-4.2E — the buyer site. When a ci run on main finishes green, build the
# site (vite base './' — relative), prove the payload budget on THAT build,
# and publish it to its own address on Cloudflare Pages
# (https://shop-plus.pages.dev, pinned below and checked against what
# Cloudflare actually gave the project). Only once the new address answers
# with that build is the old GitHub Pages address replaced by a small page
# that sends visitors on to the new one.
#
# NEEDS FROM THE FOUNDER: the repository's CLOUDFLARE_API_TOKEN must be
# allowed to create and publish Pages projects (Account → Cloudflare Pages →
# Edit). If it is not, the publish step stops with Cloudflare's refusal and
# the old address keeps serving the previous build.
# The deployed preview is a SANDBOX: the payment provider is the certified
# mock and nothing is ever debited. The on-screen ribbon that used to say so
# was removed on the founder's order (2026-08-14, BANDEAUX-RETIRÉS), so the
# sandbox status is no longer stated to the visitor — see JOURNAL.md. The
# root lands on the walkable journey. No production claim, ever.

on:
  # A publish follows ci: it starts when a ci run on main FINISHES, never on
  # the push itself (ci was still running then). The decision job ships only
  # main's newest commit, only when ci is green on it.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# `actions: read` lets the decision job read ci's results with the job's own
# token; `pages` and `id-token` are for the old address's forwarding page.
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# ═══ INCIDENT 2026-08-13 — A PUBLISH IS NEVER KILLED MID-FLIGHT ═══
#
# The founder's live storefront lost its en-têtes, cover and articles after the
# 2026-08-12 deploy batch — and a forensic replay EXONERATED the code: a shop
# written by the actually-deployed 49440ff worker (canon 3.7.0) read perfectly
# under the batch build (canon 3.12.0), byte for byte, publish included; the
# built-bundle diff carried only relaxations and the storefront read path has
# no schema parse at all. What the incident window DID have is two runs of this
# workflow racing, one CANCELLED by `cancel-in-progress: true` — a Pages
# publish killed partway. Any redeploy healed the page, which is the signature
# of a bad artifact, not bad content.
#
# So publishes now QUEUE instead of killing each other. A superseded run
# wastes a few runner minutes; a half-cancelled publish costs the founder his
# storefront and a four-repo revert.
#
# The groups sit on the jobs, not on the workflow: a run whose decide job
# skips never joins them, so it cannot push out the waiting good publish.
# build and deploy each have their own group, so a later run's waiting build
# never cancels this run's waiting deploy. decide queues nowhere.

jobs:
  decide:
    # Only a SUCCESSFUL ci run started by a push to main, or a dispatch on
    # main. The decision step checks the same again from GitHub itself.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      # CHAINE-DEPLOI-1 (AUDIT-SHOP-2 F-09) — actions pinned to commit SHAs
      # (tag kept beside each for reading); see ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Decide what may ship (main's newest commit, green in ci)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: bash scripts/publish-decision.sh

  build:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    concurrency:
      group: pwa-preview-build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # The commit the decision chose, which may be newer than the one whose
      # ci run started this.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # CHAINE-DEPLOI-1 (F-36) — the scoped platform-contracts grant, exactly
      # as ci.yml explains it: a temp gitconfig only this step reads, deleted
      # after the install; nothing written when the secret is unset.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          # The grant dies with this step whatever the install does (a failing
          # install under set -e must not leave it behind — Tier 4 verifier).
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      # BUYER-LIVE-WIRE-1 (founder order, step 4 of five) — the buyer PWA stops
      # running on the demo storefront port and reads the LIVE service.
      #
      # WHY IT IS HERE AND NOT IN vite.config.ts: this gate script IS the deploy
      # build (`execSync('pnpm --filter … build')` inside pwa-payload-budget.mjs),
      # so the value must be in this step's env or it never reaches vite. Setting it
      # here also keeps CI honest: `pnpm gates` runs the same script with the
      # variable UNSET, so the CI build keeps resolving the in-process demo port and
      # no test run can accidentally depend on a live Worker.
      #
      # READABLE AND VERSIONED, NEVER A SECRET — the same discipline as
      # PRODUCT_MEDIA_BASE. It is a public origin with nothing to protect, and the
      # SUPPLY_BASE lesson was that a value nobody can read back costs round-trips
      # when it is wrong. It is written here where a reviewer can see it.
      #
      # UNLIKE a Worker [vars] binding, this one IS a build-time substitution: vite
      # inlines `import.meta.env.VITE_*` into the emitted JS, so the deployed bundle
      # genuinely carries the literal and IS greppable — the same mechanism as the
      # esbuild --define stamps, and the reason the artifact check works here.
      #
      # CORS PRECONDITION: the service must allow the site's own origin,
      # https://shop-plus.pages.dev (storefront-service/src/index.ts
      # CORS_READ_ORIGIN), which is why this publish ships together with the
      # change that names it.
      # A LOCAL PWA build pointed at the live Worker still fails CORS by design —
      # a known, accepted limitation, not a bug.
      - name: Payload budget gate on THE deploy build (< 300 KB compressed, PERF-BUDGETS)
        env:
          VITE_STOREFRONT_BASE: https://storefront-service.ilboudobernard2.workers.dev
          # CODES-EFFACES-1 (founder order 2026-09-30) — the site buyers' links
          # open never answers the `?demo-cliente=` testing address (a demo
          # order with a « Code de démonstration »): on this profile it is an
          # ordinary visit. Unset elsewhere keeps the harness for local walks.
          VITE_PROFILE: 'production'
        run: node scripts/gates/pwa-payload-budget.mjs
      # BUG 2 — the publish ships dist AS-IS. The old redirect-wrapper (a fresh
      # index.html that meta-refreshed to app.html) CLOBBERED the SPA restore:
      # the 404.html sends every /v/ and /s/ deep link to `/shop-plus/?/…`,
      # which serves index.html — but the wrapper discarded that restore query
      # and forced its own landing, so no deep link ever restored. Deploying the
      # real index.html (the app, with the restore script) is what makes the
      # storefront links boot. The deployed root is the app's real root (S3
      # DÉCOUVERTE); a demo landing, if wanted, belongs in the app's routing,
      # never a wrapper that eats the restore.
      # THE SITE GOES TO ITS PINNED ADDRESS, OR NOWHERE. Cloudflare gives a
      # Pages project the address <name>.pages.dev when that name is free, and
      # another one when it is not. Buyers' links, the storefront's allowed
      # origin and the forwarding page all name the pin, so the project's real
      # address is read first and a different one stops the publish before
      # anything is uploaded. wrangler is the storefront service's own pinned
      # devDependency.
      - name: Publish the site to its pinned address on Cloudflare Pages
        working-directory: services/storefront-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: shop-plus
          SITE_ADDRESS: https://shop-plus.pages.dev
          PUBLISHED_SHA: ${{ needs.decide.outputs.sha }}
        run: |
          set -euo pipefail
          address() {
            pnpm exec wrangler pages project list --json 2>/dev/null | node -e '
              const t = require("fs").readFileSync(0, "utf8");
              const list = JSON.parse(t.slice(t.indexOf("["), t.lastIndexOf("]") + 1));
              const p = list.find((x) => x["Project Name"] === process.argv[1]);
              if (!p) process.exit(3);
              const d = String(p["Project Domains"]).split(",").map((x) => x.trim()).find((x) => x.endsWith(".pages.dev"));
              process.stdout.write(d ? `https://${d}` : "");
            ' "$PAGES_PROJECT"
          }
          GOT="$(address)" || {
            [ "$?" = "3" ] || { echo "::error title=Site not published::could not list the Pages projects (is the Cloudflare token allowed to use Pages?)."; exit 1; }
            echo "first publish: creating the Pages project $PAGES_PROJECT"
            pnpm exec wrangler pages project create "$PAGES_PROJECT" --production-branch main
            GOT="$(address)"
          }
          if [ "$GOT" != "$SITE_ADDRESS" ]; then
            echo "::error title=Site not published::Cloudflare gave the project the address '$GOT', not the pinned $SITE_ADDRESS. Nothing was uploaded; the old address still serves the previous build."
            exit 1
          fi
          pnpm exec wrangler pages deploy ../../apps/buyer-pwa/dist --project-name "$PAGES_PROJECT" --branch main \
            --commit-hash "$PUBLISHED_SHA" --commit-message "main@${PUBLISHED_SHA}"
      # The upload is not the rollout: wait (up to two minutes) until the pinned
      # address serves THIS build's page, and its unknown paths fall to this
      # build's 404 page (the deep-link restore). Only then is the old address
      # changed — if this fails, the old address keeps the previous build.
      - name: The new address answers with this build
        env:
          SITE_ADDRESS: https://shop-plus.pages.dev
        run: |
          set -euo pipefail
          WANT="$(sha256sum apps/buyer-pwa/dist/index.html | cut -d' ' -f1)"
          WANT404="$(sha256sum apps/buyer-pwa/dist/404.html | cut -d' ' -f1)"
          OUT="$(mktemp)"
          for attempt in $(seq 1 24); do
            CODE=$(curl -sS -m 15 -o "$OUT" -w '%{http_code}' "$SITE_ADDRESS/" 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ] && [ "$(sha256sum "$OUT" | cut -d' ' -f1)" = "$WANT" ]; then
              CODE=$(curl -sS -m 15 -o "$OUT" -w '%{http_code}' "$SITE_ADDRESS/v/adresse-inconnue-du-controle" 2>/dev/null || echo 000)
              if [ "$CODE" = "404" ] && [ "$(sha256sum "$OUT" | cut -d' ' -f1)" = "$WANT404" ]; then
                echo "NEW ADDRESS OK — $SITE_ADDRESS serves this build, and an unknown path gets its 404 page."
                exit 0
              fi
              echo "attempt $attempt: the page is this build, the unknown path answered HTTP $CODE"
            else
              echo "attempt $attempt: HTTP $CODE, not yet this build"
            fi
            sleep 5
          done
          echo "::error title=New address not answering::$SITE_ADDRESS did not serve this build within two minutes. The old address was left as it was."
          exit 1
      # The old address (GitHub Pages) now carries only the forwarding page,
      # built from the buyer site's own script and catalogue.
      - name: Build the forwarding page for the old address
        run: node apps/buyer-pwa/scripts/ancienne-adresse.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/buyer-pwa/ancienne-adresse/dist

  deploy:
    needs: build
    concurrency:
      group: pwa-preview-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
