name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CHAINE-DEPLOI-1 (AUDIT-SHOP-2 F-09) — this job READS the tree and nothing
# else; the default GITHUB_TOKEN could write.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # CHAINE-DEPLOI-1 (F-09) — every action pinned to a commit SHA, the tag it
      # resolved from kept beside it for reading: a moving tag is code nobody
      # here reviewed, next to the tokens this job holds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # CHAINE-DEPLOI-1 (F-36) — THE PLATFORM-CONTRACTS GRANT IS SCOPED. It used
      # to be written in plaintext to ~/.gitconfig for the whole job and never
      # scrubbed. Now it lives in a gitconfig under the runner's temp dir that
      # only this step reads (GIT_CONFIG_GLOBAL), arrives as env rather than
      # in the script text, and is deleted the moment the install is done.
      #
      # The repository is PUBLIC today and the lockfile resolves every
      # @platform/* to a codeload tarball, so this rewrite is the private-repo
      # fallback pnpm reaches for only when that fetch fails. It covers the
      # scp and ssh:// forms too, and MUST use --add: url.<base>.insteadOf is
      # a single-valued key, so a plain set would silently overwrite the https
      # rewrite (the sera root cause, fixed there in 297d5d5). With the secret
      # unset nothing is written and the public fetch stands. Whether the repo
      # is meant to be private is the founder's call (JOURNAL, CHAINE-DEPLOI-1).
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          # The grant dies with this step whatever the install does (a failing
          # install under set -e must not leave it behind — Tier 4 verifier).
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright chromium (buyer PWA harness)
        run: pnpm --filter @shop-plus/buyer-pwa exec playwright install --with-deps chromium
      - name: Run every invariant gate (positives + negative fixtures)
        run: bash scripts/run-gates.sh
