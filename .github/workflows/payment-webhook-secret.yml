name: payment-webhook-secret

# SP3.3a — SET (or ROTATE) `PAYMENT_WEBHOOK_SECRET` ON THE DEPLOYED WORKER.
#
# ═══ WHY THIS IS A WORKFLOW AND NOT SOMETHING A SESSION RUNS ═══
#
# `POST /checkout/webhook/payment` is the only route in this repo that can
# declare money received: an order it moves to `confirmed` is an order Séra
# takes into custody and settlement later pays out against. Its secret is the
# whole of that route's authentication.
#
# The secret therefore lives in exactly two places and NEITHER is a chat window
# or a file in this repository:
#   · the GitHub repository secret `PAYMENT_WEBHOOK_SECRET` — set by the founder,
#     readable by nobody, and the only input this workflow has;
#   · the Worker's own encrypted secret store, written by `wrangler secret put`.
# Nothing here ever prints it. GitHub masks a registered secret in logs, and this
# file additionally pipes it rather than passing it on a command line, so it never
# appears in a process listing either.
#
# ROTATION IS THE SAME ACT AS SETTING: change the repository secret, run this
# again. The Worker takes the new value on the next request; there is no restart
# and no window where both are valid, so rotate when a failed webhook is
# acceptable — the provider's own retry then carries the new one.
#
# MANUAL ONLY (workflow_dispatch): writing the credential that guards the money
# route is a deliberate act, never a side effect of a push.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-webhook-secret
  cancel-in-progress: false

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # THE REPOSITORY SECRET MUST EXIST. An unset one would make `wrangler secret
      # put` write an EMPTY value, and an empty secret is exactly the state the
      # gate treats as « not configured » — every webhook 401 — but written down
      # as though it were configured. Fail loudly instead, before touching the
      # Worker.
      - name: The repository secret must be set, and non-trivial
        env:
          WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_SECRET}" ]; then
            echo "PAYMENT_WEBHOOK_SECRET is not set on this repository."
            echo "Create it in Settings → Secrets and variables → Actions, then run this again."
            exit 1
          fi
          # Length only — never the value, never a hash of it (a hash of a short
          # secret is a crackable oracle in a public log).
          if [ "${#WEBHOOK_SECRET}" -lt 32 ]; then
            echo "PAYMENT_WEBHOOK_SECRET is ${#WEBHOOK_SECRET} characters."
            echo "This guards the only route that can declare money received; use at least 32."
            exit 1
          fi
          echo "repository secret present, length OK"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write the secret to the deployed Worker
        working-directory: services/storefront-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # PIPED, never an argument: an argument is visible in `ps` to anything
          # else on the runner for the life of the call.
          printf '%s' "${WEBHOOK_SECRET}" | npx --yes wrangler@4 secret put PAYMENT_WEBHOOK_SECRET
      # ═══ PROVE IT TOOK, WITHOUT TRUSTING THE PUT ═══
      #
      # Two probes against the LIVE Worker, and the pair is the point:
      #   · NO KEY  ⇒ 401. The gate still refuses the unauthenticated caller.
      #   · RIGHT KEY on an order that does not exist ⇒ 404 `unknown_order`.
      #     Getting PAST the 401 is the proof the secret matches; the 404 proves
      #     the route reached the order layer and refused by name.
      # A 401 on the second probe means the secret did NOT take. A 500 means the
      # route is broken. Both fail this job.
      #
      # NOTHING IS CREATED BY EITHER PROBE: the order id names nothing, and the
      # webhook path only ever reads an order that already exists.
      - name: Smoke — the gate refuses without the key and accepts with it
        env:
          WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          BASE=https://storefront-service.ilboudobernard2.workers.dev
          BODY='{"name":"payment.checkout_leg_confirmed.v1","envelope":{"command_id":"secret-smoke-${{ github.run_id }}","correlation_id":"secret-smoke","actor":"ops:smoke","serverTime":"2026-01-01T00:00:00.000Z","version":"1","aggregateVersion":1},"payload":{"order_id":"ord-zz-no-such-order"}}'
          OUT=$(mktemp)

          CODE=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST "$BASE/checkout/webhook/payment" \
            -H 'Content-Type: application/json' -d "$BODY")
          echo "no key    -> HTTP $CODE"; cat "$OUT"; echo
          test "$CODE" = "401" || { echo "FAILED: an unauthenticated webhook must be 401, got $CODE"; exit 1; }

          CODE=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST "$BASE/checkout/webhook/payment" \
            -H 'Content-Type: application/json' \
            -H "X-Payment-Webhook-Key: ${WEBHOOK_SECRET}" -d "$BODY")
          echo "right key -> HTTP $CODE"; cat "$OUT"; echo
          if [ "$CODE" = "401" ]; then
            echo "FAILED: the secret did not take — the live Worker still refuses the configured key."
            exit 1
          fi
          test "$CODE" = "404" || { echo "FAILED: expected 404 unknown_order past the gate, got $CODE"; exit 1; }
          grep -q 'unknown_order' "$OUT" || { echo "FAILED: past the gate but not a named refusal"; exit 1; }
          echo "SECRET IS LIVE — refused without the key, named refusal with it."
