name: storefront-deploy

# STOREFRONT-DEPLOY-1 — deploy the combined storefront Worker (both Durable
# Objects + the R2 media backing) to Cloudflare.
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act. The FIRST run
# also applies the DO migration (creating StorefrontDO + ListingDO), and the
# account token has been exercised ONLY for bucket creation, never an object
# write — so a first-deploy R2 permission error is plausible and is a TOKEN fix,
# not a code fix. Gated on the CLOUDFLARE_API_TOKEN repo secret.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Authorize read access to platform-contracts (CI-only)
        run: git config --global url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "https://github.com/beurni2/platform-contracts"
      # Guard against pnpm re-mangling lockfile git-dep URLs to SSH forms (see ci.yml).
      - name: Authorize read access to platform-contracts (CI-only, SSH forms)
        run: |
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "git@github.com:beurni2/platform-contracts"
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
      - run: pnpm install --frozen-lockfile
      # Compile the workspace packages first (as ci.yml does): the combined bundle
      # inlines @shop-plus/observability, whose package.json `exports` resolves to
      # dist/index.js — which only exists after a build. Without this step esbuild
      # cannot resolve it and the deploy dies before ever reaching Cloudflare.
      - run: pnpm build
      # SERVICE-PROVENANCE-1 — stamp the bundle so the deployed artifact can say
      # WHICH BUILD it is (release) and WHICH WIRE SHAPE it speaks (canon). The
      # second is the one that matters: a sha alone would not have revealed that
      # the live Worker still predated the listings gate, or that boutik was still
      # emitting the five-field projection. Read canon from the INSTALLED package,
      # never from a hand-typed constant, so it cannot drift from what was bundled.
      - name: Resolve the provenance stamp
        run: |
          echo "SHOP_RELEASE=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "SHOP_CANON=$(node -p "require('./node_modules/@platform/contracts/package.json').version")" >> "$GITHUB_ENV"
      - name: Bundle the combined Worker (both DOs + service routes + R2 read)
        run: pnpm --filter @shop-plus/storefront-service bundle:worker:combined
      - name: Deploy to Cloudflare Workers
        working-directory: services/storefront-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
      # DEPLOY-SMOKE-1 — PROVE THE DEPLOYED SURFACE ANSWERS, here and nowhere else.
      #
      # A green `wrangler deploy` proves the upload was accepted. It does NOT prove
      # the Worker runs: a missing Durable Object class, a migration that did not
      # apply, a binding named differently from the code — every one of those
      # deploys green and then answers 1101 (« Worker threw an exception ») on the
      # first real request. SP3.2a shipped exactly such a change (the `v2` migration
      # creating CheckoutDO), and the session that deployed it could not reach
      # workers.dev to check. This job can: it runs on GitHub's network.
      #
      # WHAT IT ASSERTS, and why each choice:
      #   · A NONEXISTENT SHOP. The request must be REFUSED, so no quote is ever
      #     issued, nothing is held, and no real storefront or listing is touched.
      #     Stated exactly rather than flattered: the router claims the request key
      #     BEFORE it reads the authority, so each run does leave one empty
      #     key-pointer object behind — a name with an id in it, no money, no
      #     quote, unreachable without the key itself.
      #   · A NAMED REFUSAL with the documented status — `listing_unknown` at 404 is
      #     what an unknown shop AND an unknown product both answer (the surface is
      #     deliberately not an existence oracle). A 1101/500/404-from-the-router
      #     would all fail here, which is the whole point: those are the shapes a
      #     broken binding produces.
      #   · A UNIQUE requestKey per run, so the smoke never replays another run's
      #     key and reads back its answer instead of exercising the path.
      # It does NOT assert any amount: this route answers no price to an unknown
      # shop, and a smoke test that needed one would be a smoke test that created one.
      # SERVICE-CANON-DRIFT-1 (founder-caught 2026-07-30) — PROVE THE DEPLOY TOOK
      # THE CANON IT WAS BUILT WITH.
      #
      # The defect: ENTETES-E opened the Personnaliser picker to eleven header
      # styles and merged green, but `storefront-deploy` is manual, so the LIVE
      # Worker still validated against the six-style enum. Every tap on the five
      # new cards was refused `unknown_header_style`. Nothing in CI could see it —
      # the client and the service were each internally consistent, and only their
      # DEPLOYED pair was wrong. The founder found it on his phone, in Ouaga.
      #
      # `/health` already answers `canon` (the contracts version bundled in) and
      # `release` (the sha). Asserting BOTH against what this job just built is
      # what makes a deploy self-verifying: a green `wrangler deploy` that somehow
      # served an older bundle now fails HERE rather than in her hands. `no-store`
      # on that route (an earlier founder finding) is what makes the read truthful.
      - name: Assert the live Worker speaks the canon this job bundled
        run: |
          set -euo pipefail
          BASE=https://storefront-service.ilboudobernard2.workers.dev
          OUT=$(mktemp)
          CODE=$(curl -sS -o "$OUT" -w '%{http_code}' "$BASE/health")
          echo "health: $CODE $(cat "$OUT")"
          test "$CODE" = "200"
          LIVE_CANON=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).canon")
          LIVE_RELEASE=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).release")
          echo "live canon=$LIVE_CANON expected=$SHOP_CANON"
          echo "live release=$LIVE_RELEASE expected=$SHOP_RELEASE"
          if [ "$LIVE_CANON" != "$SHOP_CANON" ] || [ "$LIVE_RELEASE" != "$SHOP_RELEASE" ]; then
            echo "DEPLOY DID NOT TAKE — the live Worker is not the bundle this job built."
            exit 1
          fi
          echo "PROVENANCE OK — live Worker is $SHOP_RELEASE speaking canon $SHOP_CANON."
      - name: Smoke — the deployed checkout surface answers by NAME, not by crashing
        run: |
          set -euo pipefail
          BASE=https://storefront-service.ilboudobernard2.workers.dev
          KEY="deploy-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          BODY=$(printf '{"slug":"zz-deploy-smoke-no-such-shop","pid":"zz-no-such-product","paymentMode":"FULL_PREPAY","zoneTo":"Gounghin, Ouagadougou","attributionResellerId":"zz-smoke","requestKey":"%s"}' "$KEY")
          OUT=$(mktemp)
          CODE=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST "$BASE/checkout/quote" \
            -H 'Content-Type: application/json' -d "$BODY")
          echo "HTTP $CODE"; cat "$OUT"; echo
          test "$CODE" = "404" || { echo "SMOKE FAILED: expected 404, got $CODE"; exit 1; }
          grep -q '"error":"listing_unknown"' "$OUT" || { echo "SMOKE FAILED: no named refusal in the body"; exit 1; }
          echo "SMOKE OK — CheckoutDO is live and refuses by name."
